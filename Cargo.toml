[package]
name = "rustodon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A mostly-in-place Mastodon replacement written in Rust"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
