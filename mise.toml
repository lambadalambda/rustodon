min_version = "2026.8.4"

[tools]
rust = "1.97.1"
clang = "22.1.8"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all Rust tests"
run = "cargo test --locked --all-targets --all-features"

[tasks.deny]
description = "Check dependency licenses, advisories, bans, and sources"
run = "cargo deny --locked check"

[tasks.fixture-obtain]
description = "Obtain and verify the pinned Mastodon 4.6.5 source"
run = "tools/mastodon-fixture obtain"

[tasks.fixture-generate]
description = "Generate the pinned Mastodon 4.6.5 fixture with Podman"
run = "tools/mastodon-fixture generate"

[tasks.fixture-verify]
description = "Verify fixture metadata and checksums without Podman"
run = "tools/mastodon-fixture verify"

[tasks.fixture-restore-verify]
description = "Restore and verify the fixture with PostgreSQL and Mastodon Rails"
run = "tools/mastodon-fixture restore-verify"

[tasks.fixture-repro]
description = "Regenerate and byte-compare the Mastodon 4.6.5 fixture"
run = "tools/mastodon-fixture repro"

[tasks.check]
description = "Run all local and CI checks"
depends = ["fmt", "lint", "test", "deny", "fixture-verify"]
