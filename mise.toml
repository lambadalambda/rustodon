min_version = "2026.8.4"

[tools]
rust = "1.97.1"
clang = "22.1.8"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
AR = "{{config_root}}/tools/clang-ar"
CC = "clang"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run ordinary feature-enabled Rust tests (fixture ignores excluded)"
run = "cargo test --locked --all-targets --all-features"

[tasks.test-default]
description = "Run ordinary default-feature Rust tests (fixture ignores excluded)"
run = "cargo test --locked --all-targets"

[tasks.test-release]
description = "Run ordinary release/all-feature tests, including negative capability fences"
run = "cargo test --locked --release --all-targets --all-features"

[tasks.harness-tests]
description = "Run offline shell/Python harness regressions without fixture workloads"
run = "tools/check-harnesses"

[tasks.worker-media-verify]
description = "Verify vendored pinned worker assets without a source checkout"
run = "tools/verify-worker-media"

[tasks.media-processor]
description = "Exercise the real bounded FFmpeg/ffprobe normalization and capability paths"
run = "cargo test --locked --all-features --test media_processor -- --ignored --nocapture --test-threads=1"

[tasks.deny]
description = "Check dependency licenses, advisories, bans, and sources"
run = "cargo deny --locked check"

[tasks.fixture-obtain]
description = "Obtain and verify the pinned Mastodon 4.6.5 source"
run = "tools/mastodon-fixture obtain"

[tasks.fixture-generate]
description = "Generate the pinned Mastodon 4.6.5 fixture with Podman"
run = "tools/mastodon-fixture generate"

[tasks.fixture-verify]
description = "Verify fixture metadata and checksums without Podman"
run = "tools/mastodon-fixture verify"

[tasks.pinned-source-contracts]
description = "Verify independently derived pinned frontend and Rails source contracts"
run = "tools/pinned-source-contracts"

[tasks.fixture-restore-verify]
description = "Restore and verify the fixture with PostgreSQL and Mastodon Rails"
run = "tools/mastodon-fixture restore-verify"

[tasks.fixture-repro]
description = "Regenerate and byte-compare the Mastodon 4.6.5 fixture"
run = "tools/mastodon-fixture repro"

[tasks.mastodon-schema-integration]
description = "Run restored-schema integration and the aggregate focused HTTP regressions"
run = "tools/mastodon-fixture schema-read-test"

[tasks.operational-schema-integration]
description = "Create and verify the isolated Rustodon operational schema"
run = "tools/mastodon-fixture operational-schema-test"

[tasks.standalone-bootstrap-integration]
description = "Bootstrap and smoke-test an empty standalone PostgreSQL 14 instance"
run = "tools/standalone-bootstrap-fixture"

[tasks.worker-integration]
description = "Exercise durable jobs, scheduler readiness, and worker shutdown"
run = "tools/mastodon-fixture worker-test"

[tasks.startup-integration]
description = "Prove production web and worker startup fail closed"
run = "tools/mastodon-fixture startup-test"

[tasks.preflight-integration]
description = "Run canonical and rejection preflight cases against fixture clones"
run = "tools/mastodon-fixture preflight-test"

[tasks.cutover-integration]
description = "Rehearse Rustodon cutover, smoke checks, rollback, and Mastodon reopen"
run = "tools/mastodon-fixture cutover-test"

[tasks.browser-integration]
description = "Run Chromium startup and SPA navigation against the cutover fixture"
run = "RUSTODON_BROWSER_SMOKE=true RUSTODON_BROWSER_AUTH=true RUSTODON_BROWSER_EMAIL=alice@fixture.invalid RUSTODON_BROWSER_PASSWORD=fixture-password RUSTODON_BROWSER_OTP=fixture-recovery-code RUSTODON_BROWSER_VOTER_EMAIL=moderator@fixture.invalid RUSTODON_BROWSER_VOTER_PASSWORD=fixture-password RUSTODON_BROWSER_VOTER_OTP=fixture-no-otp tools/mastodon-fixture cutover-test"

[tasks.differential]
description = "Run all or one Rails-versus-Rust differential compatibility case"
run = "tools/mastodon-fixture differential-test"

[tasks.differential-ci]
description = "Run eleven high-value/security differential cases plus relative media-root mode"
run = "tools/ci-differential"

[tasks.differential-full]
description = "Run the full differential suite plus relative media-root mode (extended lane)"
run = "tools/ci-differential full"

# Manual only: each peer task explicitly authorizes the generic cache-only runner.
[tasks.peer-public]
description = "Manual isolated real-peer public push (cache-only)"
run = "RUSTODON_PEER_SMOKE=1 tools/federation-peer-smoke public"

[tasks.peer-privacy]
description = "Manual isolated real-peer recipient/outsider privacy (cache-only)"
run = "RUSTODON_PEER_SMOKE=1 tools/federation-peer-smoke privacy"

[tasks.peer-notes]
description = "Manual isolated real-peer Note lifecycle (cache-only)"
run = "RUSTODON_PEER_SMOKE=1 tools/federation-peer-smoke notes"

[tasks.peer-profile]
description = "Manual isolated real-peer profile updates (cache-only)"
run = "RUSTODON_PEER_SMOKE=1 tools/federation-peer-smoke profile"

[tasks.peer-interactions]
description = "Manual isolated real-peer interactions and Undo (cache-only)"
run = "RUSTODON_PEER_SMOKE=1 tools/federation-peer-smoke interactions"

[tasks.peer-replies]
description = "Manual isolated real-peer reply threading (cache-only)"
run = "RUSTODON_PEER_SMOKE=1 tools/federation-peer-smoke replies"

[tasks.check]
description = "Run bounded ordinary/profile, static fixture, and offline harness checks"
depends = ["fmt", "lint", "test", "test-default", "test-release", "deny", "fixture-verify", "worker-media-verify", "harness-tests"]
