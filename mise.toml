min_version = "2026.8.4"

[tools]
rust = "1.97.1"
clang = "22.1.8"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
AR = "{{config_root}}/tools/clang-ar"
CC = "clang"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all Rust tests"
run = "cargo test --locked --all-targets --all-features"

[tasks.deny]
description = "Check dependency licenses, advisories, bans, and sources"
run = "cargo deny --locked check"

[tasks.fixture-obtain]
description = "Obtain and verify the pinned Mastodon 4.6.5 source"
run = "tools/mastodon-fixture obtain"

[tasks.fixture-generate]
description = "Generate the pinned Mastodon 4.6.5 fixture with Podman"
run = "tools/mastodon-fixture generate"

[tasks.fixture-verify]
description = "Verify fixture metadata and checksums without Podman"
run = "tools/mastodon-fixture verify"

[tasks.fixture-restore-verify]
description = "Restore and verify the fixture with PostgreSQL and Mastodon Rails"
run = "tools/mastodon-fixture restore-verify"

[tasks.fixture-repro]
description = "Regenerate and byte-compare the Mastodon 4.6.5 fixture"
run = "tools/mastodon-fixture repro"

[tasks.mastodon-schema-integration]
description = "Run read-only Rust schema integration against the restored fixture"
run = "tools/mastodon-fixture schema-read-test"

[tasks.operational-schema-integration]
description = "Create and verify the isolated Rustodon operational schema"
run = "tools/mastodon-fixture operational-schema-test"

[tasks.worker-integration]
description = "Exercise durable jobs, scheduler readiness, and worker shutdown"
run = "tools/mastodon-fixture worker-test"

[tasks.startup-integration]
description = "Prove production web and worker startup fail closed"
run = "tools/mastodon-fixture startup-test"

[tasks.preflight-integration]
description = "Run canonical and rejection preflight cases against fixture clones"
run = "tools/mastodon-fixture preflight-test"

[tasks.cutover-integration]
description = "Rehearse Rustodon cutover, smoke checks, rollback, and Mastodon reopen"
run = "tools/mastodon-fixture cutover-test"

[tasks.browser-integration]
description = "Run Chromium startup and SPA navigation against the cutover fixture"
run = "RUSTODON_BROWSER_SMOKE=true RUSTODON_BROWSER_AUTH=true RUSTODON_BROWSER_EMAIL=alice@fixture.invalid RUSTODON_BROWSER_PASSWORD=fixture-password RUSTODON_BROWSER_OTP=fixture-recovery-code tools/mastodon-fixture cutover-test"

[tasks.differential]
description = "Run all or one Rails-versus-Rust differential compatibility case"
run = "tools/mastodon-fixture differential-test"

[tasks.check]
description = "Run all local and CI checks"
depends = ["fmt", "lint", "test", "deny", "fixture-verify"]
