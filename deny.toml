[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Used only by offline preflight to sign one fixed in-memory challenge. It is
  # never used for RSA decryption or remotely observable request-time signing.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = ["0BSD", "Apache-2.0", "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0"]
exceptions = [
  # Ammonia's standards-compliant CSS parsing stack is MPL-2.0.
  { name = "cssparser", version = "=0.37.0", allow = ["MPL-2.0"] },
  { name = "dtoa-short", version = "=0.3.5", allow = ["MPL-2.0"] },
  # Shared by SQLx and Saphyr through the aligned hashbrown/hashlink stack.
  { name = "foldhash", version = "=0.1.5", allow = ["Zlib"] },
  # SQLx PostgreSQL authentication reaches this through the digest stack.
  { name = "subtle", version = "=2.6.1", allow = ["BSD-3-Clause"] },
  # Axum's route matcher is dual-licensed as MIT AND BSD-3-Clause.
  { name = "matchit", version = "=0.8.4", allow = ["BSD-3-Clause"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = [
   # Lettre's email encoding stack currently uses a parallel major release.
   { name = "base64", version = "=0.23.1" },
   # SQLx's Redox support and whoami currently select different major releases.
   { name = "redox_syscall", version = "=0.5.18" },
  # SQLx derives use syn 2 while the pinned CLI/Serde stack has moved to syn 3.
  { name = "syn", version = "=2.0.119" },
   # SQLx's etcetera still supports the older Windows API crate line.
   { name = "windows-sys", version = "=0.48.0" },
   # Lettre's Rustls stack currently uses a parallel major release.
   { name = "webpki-roots", version = "=1.0.9" },
]
skip-tree = [
  # Ring's Windows support remains on the 0.52 platform crate family.
  { name = "windows-sys", version = "=0.52.0" },
  # Axum's WebSocket transport currently requires tokio-tungstenite 0.29,
  # whose rand 0.9 tree is parallel to the crypto and SQLx rand 0.8 tree.
  { name = "rand", version = "=0.9.5" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
